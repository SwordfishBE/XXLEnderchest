plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

subprojects {
    apply plugin: 'java-library'
    group = rootProject.maven_group
    version = rootProject.mod_version
    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven { url = 'https://maven.shedaniel.me/' }
    }
    // Compile the same core sources against each loader's Minecraft environment.
    sourceSets {
        main {
            java.srcDir rootProject.file('core/src/main/java')
            resources.srcDir rootProject.file('core/src/main/resources')
        }
        test {
            java.srcDir rootProject.file('core/src/test/java')
        }
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
    }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testImplementation 'com.google.jimfs:jimfs:1.3.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
    tasks.named('jar') {
        from(rootProject.file('LICENSE'))
    }
}
tasks.named('build') {
    dependsOn ':fabric:build', ':neoforge:build'
}
tasks.named('check') {
    dependsOn ':fabric:check', ':neoforge:check'
}
tasks.named('assemble') {
    dependsOn ':fabric:assemble', ':neoforge:assemble'
}
tasks.named('clean') {
    dependsOn ':fabric:clean', ':neoforge:clean'
}
