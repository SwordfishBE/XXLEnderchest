plugins {
    id 'net.fabricmc.fabric-loom'
}

loom {
    splitEnvironmentSourceSets()
    mods {
        xxlenderchest {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets.client.java.srcDir rootProject.file('core/src/client/java')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    include(implementation('me.lucko:fabric-permissions-api:0.7.0'))
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    localRuntime("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
